name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Semantic version without the leading v (example: 2.1.0)"
        required: true
        type: string

      dry_run:
        description: "Validate the release without creating a tag or GitHub Release"
        required: true
        default: true
        type: boolean

permissions:
  contents: write

jobs:
  release:
    name: Create release
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Validate version
        env:
          VERSION: ${{ inputs.version }}
        run: |
          if [[ ! "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Invalid semantic version: $VERSION"
            echo "Expected format: MAJOR.MINOR.PATCH"
            exit 1
          fi

          echo "Version $VERSION is valid."

      - name: Check tag does not exist
        env:
          VERSION: ${{ inputs.version }}
        run: |
          if git rev-parse "v$VERSION" >/dev/null 2>&1; then
            echo "::error::Tag v$VERSION already exists."
            exit 1
          fi

          echo "Tag v$VERSION is available."

      - name: Configure Git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Dry run
        if: inputs.dry_run
        env:
          VERSION: ${{ inputs.version }}
        run: |
          echo "Dry run enabled."
          echo "No tag or GitHub Release will be created."
          echo "Would create tag: v$VERSION"
          echo "Would create GitHub Release: v$VERSION"

      - name: Create tag
        if: ${{ !inputs.dry_run }}
        env:
          VERSION: ${{ inputs.version }}
        run: |
          git tag -a "v$VERSION" -m "chore(release): v$VERSION"
          git push origin "v$VERSION"

      - name: Create GitHub Release
        if: ${{ !inputs.dry_run }}
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ inputs.version }}
        run: |
          gh release create "v$VERSION" \
            --title "v$VERSION" \
            --generate-notes